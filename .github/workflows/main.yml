
name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Generate Android project
        working-directory: artifacts/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Check Expo and Babel configuration
        working-directory: artifacts/mobile
        run: |
          echo "=== Expo version ==="
          npx expo --version
          echo "=== Babel config ==="
          cat babel.config.js || true
          echo "=== Metro config ==="
          cat metro.config.js || true

      - name: Build AAB and show real error
        working-directory: artifacts/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo ""
          echo "========================================"
          echo "AKILCEP BUILD SONUCU"
          echo "========================================"
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "BUILD FAILED"
            echo ""
            echo "Gercek hata satirlari:"
            grep -E "Error:|ERROR|TypeError:|ReferenceError:|Cannot find|Unable to resolve|TransformError|ConfigError" build.log | head -50 || true
          else
            echo "BUILD SUCCESS"
          fi
          exit $EXIT_CODE

      - name: Upload AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AkılCEP-AAB
          path: artifacts/mobile/android/app/build/outputs/bundle/release/*.aab