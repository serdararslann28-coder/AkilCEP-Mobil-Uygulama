name: Build Android AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Generate Android project
        working-directory: artifacts/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Restore Google Play upload keystore
        working-directory: artifacts/mobile/android
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
          test -s app/upload-keystore.jks
          echo "Upload keystore restored."

      - name: Configure release signing and versionCode
        working-directory: artifacts/mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "Using versionCode: $VERSION_CODE"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("app/build.gradle")
          text = path.read_text()

          if "releaseUpload {" not in text:
              text = text.replace(
                  "signingConfigs {",
                  """signingConfigs {
                      releaseUpload {
                          storeFile file('upload-keystore.jks')
                          storePassword System.getenv('KEYSTORE_PASSWORD')
                          keyAlias System.getenv('KEY_ALIAS')
                          keyPassword System.getenv('KEY_PASSWORD')
                      }""",
                  1
              )

          occurrences = list(
              re.finditer(
                  r'\bsigningConfig\s+signingConfigs\.debug\b',
                  text
              )
          )

          if len(occurrences) >= 2:
              m = occurrences[1]
              text = (
                  text[:m.start()]
                  + "signingConfig signingConfigs.releaseUpload"
                  + text[m.end():]
              )
          elif "signingConfig signingConfigs.releaseUpload" not in text:
              raise SystemExit(
                  "Release signingConfig could not be located."
              )

          version_code = os.environ["VERSION_CODE"]

          if not version_code.isdigit():
              raise SystemExit(
                  f"Invalid VERSION_CODE: {version_code}"
              )

          text, count = re.subn(
              r'(\bversionCode\s+)\d+',
              lambda m: m.group(1) + version_code,
              text,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "versionCode could not be located."
              )

          path.write_text(text)
          PY

          echo "=== Release signing check ==="
          grep -n -A8 "releaseUpload" app/build.gradle

          echo "=== versionCode check ==="
          grep -n "versionCode" app/build.gradle

      - name: Verify upload key
        working-directory: artifacts/mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -v | grep -E "Alias name:|SHA1:|SHA256:"

      - name: Check Expo and Babel configuration
        working-directory: artifacts/mobile
        run: |
          echo "=== Expo version ==="
          npx expo --version

          echo "=== Babel config ==="
          cat babel.config.js || true

          echo "=== Metro config ==="
          cat metro.config.js || true

      - name: Build AAB and show real error
        working-directory: artifacts/mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew

          ./gradlew bundleRelease --stacktrace 2>&1 | tee build.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "AKILCEP BUILD SONUCU"
          echo "========================================"

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "BUILD FAILED"
            echo ""
            echo "Gercek hata satirlari:"
            grep -E "Error:|ERROR|TypeError:|ReferenceError:|Cannot find|Unable to resolve|TransformError|ConfigError" build.log | head -50 || true
          else
            echo "BUILD SUCCESS"
          fi

          exit $EXIT_CODE

      - name: Upload AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AkılCEP-AAB
          path: artifacts/mobile/android/app/build/outputs/bundle/release/*.aab

      - name: Cleanup signing key
        if: always()
        run: |
          rm -f artifacts/mobile/android/app/upload-keystore.jks