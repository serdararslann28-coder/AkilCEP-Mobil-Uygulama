name: Android AAB + Google Play

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android native project
        working-directory: artifacts/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: pnpm dlx expo@latest prebuild --platform android --non-interactive
      - name: Include generated Android project in EAS archive
        working-directory: artifacts/mobile
        run: |
          printf "\n!android/\n!android/**\n" >> .easignore
          echo "Android native project will be included in EAS archive."
          test -f android/gradlew && echo "gradlew OK" || (echo "gradlew MISSING"; exit 1)
      - name: Build Android AAB with EAS
        working-directory: artifacts/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          pnpm dlx eas-cli@latest build \
            --platform android \
            --profile production \
            --non-interactive \
            --wait \
            --verbose-logs

      - name: Download AAB
        working-directory: artifacts/mobile
        run: |
          BUILD_URL=$(jq -r '.[0].artifacts.buildUrl' eas-build.json)

          if [ -z "$BUILD_URL" ] || [ "$BUILD_URL" = "null" ]; then
            echo "❌ AAB URL bulunamadı."
            cat eas-build.json
            exit 1
          fi

          echo "AAB indiriliyor..."
          curl -L "$BUILD_URL" -o AkilCEP.aab

          ls -lh AkilCEP.aab

      - name: Upload to Google Play Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.akilcep.ai
          releaseFiles: artifacts/mobile/AkilCEP.aab
          tracks: internal
          status: completed
