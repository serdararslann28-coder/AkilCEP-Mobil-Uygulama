openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: openai
    description: OpenAI AI chat, image, and audio operations
paths:
  /weather/current:
    get:
      operationId: getWeatherCurrent
      summary: Keyless current conditions, normalized for the atmosphere engine
      parameters:
        - { name: latitude, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: longitude, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        "200":
          description: Current conditions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeatherConditions" }
        "400": { $ref: "#/components/responses/WeatherFailure" }
        "429": { $ref: "#/components/responses/WeatherFailure" }
        "502": { $ref: "#/components/responses/WeatherFailure" }
        "503": { $ref: "#/components/responses/WeatherFailure" }
        "504": { $ref: "#/components/responses/WeatherFailure" }
  /weather/cities:
    get:
      operationId: getWeatherCities
      summary: Keyless city geocoding search
      parameters:
        - { name: query, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 120 } }
      responses:
        "200":
          description: Selectable locations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeatherCities" }
        "400": { $ref: "#/components/responses/WeatherFailure" }
        "429": { $ref: "#/components/responses/WeatherFailure" }
        "502": { $ref: "#/components/responses/WeatherFailure" }
        "503": { $ref: "#/components/responses/WeatherFailure" }
        "504": { $ref: "#/components/responses/WeatherFailure" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
  /openai/conversations/{id}/voice-messages:
    post:
      operationId: sendOpenaiVoiceMessage
      tags: [openai]
      summary: Send audio or a recognized transcript and receive a voice-friendly text reply
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiVoiceMessageInput"
      responses:
        "200":
          description: Recognized transcript and AI reply for device TTS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiVoiceMessageResponse"
  /openai/transcribe:
    post:
      operationId: transcribeOpenaiAudio
      tags: [openai]
      summary: Transcribe a completed recording in Turkish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiTranscriptionInput"
      responses:
        "200":
          description: Final transcript, not live interim recognition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiTranscriptionResponse"
components:
  responses:
    WeatherFailure:
      description: Safe weather configuration, validation, quota or upstream error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WeatherFailure" }
  schemas:
    WeatherFailure:
      type: object
      required: [code, error]
      properties:
        code: { type: string }
        error: { type: string }
    WeatherConditions:
      type: object
      required: [provider, current]
      properties:
        provider: { type: string, enum: [open-meteo] }
        current:
          type: object
          required: [time, temperature_2m, apparent_temperature, precipitation, rain, showers, snowfall, weather_code, cloud_cover, wind_speed_10m, is_day, description]
          description: Current WMO conditions; rain and precipitation in mm, snowfall in cm, wind in km/h.
          properties:
            time: { type: string }
            temperature_2m: { type: number }
            apparent_temperature: { type: number }
            precipitation: { type: number }
            rain: { type: number }
            showers: { type: number }
            snowfall: { type: number }
            weather_code: { type: integer }
            cloud_cover: { type: number }
            wind_speed_10m: { type: number }
            is_day: { type: integer, enum: [0, 1] }
            description: { type: string }
    WeatherCities:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/WeatherCity" }
    WeatherCity:
      type: object
      required: [name, latitude, longitude]
      properties:
        name: { type: string }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        resolvedAt: { type: number }
    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt
    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt
    OpenaiConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title
    OpenaiMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content
    OpenaiVoiceMessageInput:
      type: object
      properties:
        audio:
          type: string
          description: Base64-encoded audio data
        text:
          type: string
          minLength: 1
          maxLength: 4000
          description: Already recognized text; avoids a second transcription
      anyOf:
        - required: [audio]
        - required: [text]
    OpenaiVoiceMessageResponse:
      type: object
      properties:
        userText:
          type: string
        assistantText:
          type: string
      required: [userText, assistantText]
    OpenaiTranscriptionInput:
      type: object
      properties:
        audio:
          type: string
          description: Base64-encoded completed audio recording
      required: [audio]
    OpenaiTranscriptionResponse:
      type: object
      properties:
        text:
          type: string
      required: [text]
    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messages
    OpenaiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

